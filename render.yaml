services:
  - type: web
    name: iie-crm
    env: python
    plan: free
    buildCommand: bash build.sh
    startCommand: python manage.py migrate --noinput && gunicorn wsgi:application
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: APP_BASE_PATH
        value: ""
      - key: ALLOWED_HOSTS
        value: ".onrender.com,wingrootechnologies.com,www.wingrootechnologies.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com,https://wingrootechnologies.com,https://www.wingrootechnologies.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://wingrootechnologies.com,https://www.wingrootechnologies.com"
      - key: CORS_ALLOWED_ORIGIN_REGEXES
        value: "^https://.*\\.onrender\\.com$"
      - key: PYTHON_VERSION
        value: "3.10.11"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: iie-crm-db
          property: connectionString

databases:
  - name: iie-crm-db
    plan: free
